
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartBako{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F8F7F4;
            color: #2E2A27;
        }

        header {
            background: #849AAD;
            color: white;
            padding: 20px 7%;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
        }

        main {
            padding: 35px 7%;
        }

        .kartu {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .tombol {
            display: inline-block;
            background: #5E1C23;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>SmartBako</h1>
        <p>Temukan sembako sesuai kebutuhanmu</p>

        <nav>
            <a href="/">Beranda</a>
            <a href="/katalog/">Katalog Produk</a>
            <a href="/rekomendasi/">Rekomendasi</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
