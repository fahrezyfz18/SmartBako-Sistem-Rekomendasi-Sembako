{% comment %}
    Bilah atas panel admin: tombol menu (HP/tablet), tanggal, tombol cepat, dan menu akun.
    Dipanggil oleh panel_admin/base_admin.html.
{% endcomment %}
<header class="sb-topbar">
    <div class="d-flex align-items-center justify-content-between gap-3 px-3 px-lg-4 py-2">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light-subtle btn-icon d-lg-none" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarAdmin" aria-controls="sidebarAdmin" aria-label="Buka menu">
                <i class="bi bi-list fs-5"></i>
            </button>
            <span class="text-secondary small d-none d-md-inline">
                <i class="bi bi-calendar3 me-1"></i>{% now "l, d F Y" %}
            </span>
        </div>

        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'smartbako:tambah_produk' %}" class="btn btn-sm btn-primary d-none d-sm-inline-flex align-items-center gap-1">
                <i class="bi bi-plus-lg"></i> Produk
            </a>
            <div class="dropdown">
                <button class="btn d-flex align-items-center gap-2 border-0 px-1" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu akun">
                    <span class="sb-avatar">{{ request.user.first_name|default:request.user.email|first|upper }}</span>
                    <i class="bi bi-chevron-down small text-secondary"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                    <li class="px-3 py-2">
                        <div class="fw-semibold">{{ request.user.first_name|default:"Admin" }}</div>
                        <small class="text-secondary">{{ request.user.email }}</small>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form action="{% url 'smartbako:logout_admin' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-left me-2"></i>Keluar
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
