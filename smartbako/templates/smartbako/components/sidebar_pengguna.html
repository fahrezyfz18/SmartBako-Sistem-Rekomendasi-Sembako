{% with nama_url=request.resolver_match.url_name %}

<div class="user-overlay" data-sidebar-close hidden></div>

<aside class="user-sidebar" id="sidebar-pengguna">
    <div class="user-sidebar__heading">
        <span>MENU UTAMA</span>
        <h2>Panel Pengguna</h2>
    </div>

    <nav class="user-sidebar__navigation" aria-label="Navigasi pengguna">
        <a
            href="{% url 'smartbako:beranda' %}"
            {% if nama_url == 'beranda' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            Beranda
        </a>

        <a
            href="{% url 'smartbako:katalog' %}"
            {% if nama_url == 'katalog' or nama_url == 'detail_produk' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Katalog Produk
        </a>

        <a
            href="{% url 'smartbako:atur_preferensi' %}"
            {% if nama_url == 'atur_preferensi' or nama_url == 'rekomendasi' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            Atur Preferensi
        </a>

        <a
            href="{% url 'smartbako:riwayat' %}"
            {% if nama_url == 'riwayat' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Riwayat Rekomendasi
        </a>

        <a
            href="{% url 'smartbako:bandingkan_produk' %}"
            {% if nama_url == 'bandingkan_produk' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>
            Bandingkan Produk
            <span class="user-sidebar__count" data-compare-badge hidden>0</span>
        </a>

        <a
            href="{% url 'smartbako:profil' %}"
            {% if nama_url == 'profil' or nama_url == 'ubah_password' %}class="active" aria-current="page"{% endif %}
        >
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            Profil Saya
        </a>
    </nav>

    <div class="user-sidebar__footer">
        <strong>SmartBako</strong>
        <span>Pas harganya, pas butuhnya.</span>
    </div>
</aside>

{% endwith %}
