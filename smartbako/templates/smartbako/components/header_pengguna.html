{% load static %}

<header class="user-header">
    <div class="user-header__left">
        <button
            type="button"
            class="user-header__menu"
            data-sidebar-toggle
            aria-label="Buka menu navigasi"
            aria-controls="sidebar-pengguna"
            aria-expanded="false"
        >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <a href="{% url 'smartbako:beranda' %}" class="user-header__brand">
            <img
                src="{% static 'smartbako/images/logo1.png' %}"
                alt="SmartBako"
            >
        </a>
    </div>

    <div class="user-header__account">
        <a href="{% url 'smartbako:profil' %}" class="user-header__user">
            <span class="avatar" aria-hidden="true">
                {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}
            </span>

            <span class="user-header__identity">
                <span>Selamat datang,</span>
                <strong>{{ request.user.first_name|default:request.user.username }}</strong>
            </span>
        </a>

        <form method="post" action="{% url 'smartbako:logout' %}">
            {% csrf_token %}
            <button type="submit" class="user-header__logout">
                Keluar
            </button>
        </form>
    </div>
</header>
