{% load static %}
<!-- START: HEADER PENGGUNA -->
<header class="h-20 bg-white border-b border-slate-200 px-6 sm:px-8 flex items-center justify-between sticky top-0 z-40 shadow-xs">
    
    <!-- Bagian Kiri: Logo & Judul Panel -->
    <div class="flex items-center space-x-4">
        <a href="{% url 'smartbako:beranda' %}" class="flex items-center group">
            <img src="{% static 'smartbako/images/logo1.png' %}" alt="Logo SmartBako" class="h-10 w-auto object-contain">
        </a>
        <span class="hidden sm:inline-block bg-slate-100 text-slate-600 font-medium text-xs px-3 py-1 rounded-full border border-slate-200">
            Panel Pengguna
        </span>
    </div>

    <!-- Bagian Tengah: Kolom Pencarian Cepat -->
    <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" placeholder="Cari produk sembako..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#581c1c]/20 focus:border-[#581c1c]">
        </div>
    </div>

    <!-- Bagian Kanan: Notifikasi & Profil Pengguna -->
    <div class="flex items-center space-x-4">
        <!-- Ikon Notifikasi -->
        <button class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="absolute top-2 right-2 w-2 h-2 bg-rose-600 rounded-full"></span>
        </button>

        <!-- Profil Pengguna -->
        <div class="flex items-center space-x-3 pl-3 border-l border-slate-200">
            <div class="w-10 h-10 rounded-full bg-[#581c1c]/10 text-[#581c1c] flex items-center justify-center font-bold text-sm">
                {{ request.user.username|slice:":1"|upper }}
            </div>
            <div class="hidden sm:block text-left">
                <span class="text-xs text-slate-400 block leading-none">Halo,</span>
                <span class="text-sm font-bold text-slate-800 block truncate max-w-[120px]">
                    {{ request.user.first_name|default:request.user.username }}
                </span>
            </div>
        </div>
    </div>

</header>
<!-- END: HEADER PENGGUNA -->
