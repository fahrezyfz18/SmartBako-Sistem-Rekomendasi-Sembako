{% comment %}
    Baki perbandingan produk (maksimal 3 produk sesuai US-07 AC1).
    Diisi dan dikendalikan oleh static/smartbako/js/pengguna.js.
    data-max harus sama dengan BATAS_BANDINGKAN di views_pengguna.py.
{% endcomment %}
<div class="compare-tray" id="compare-tray" data-url="{% url 'smartbako:bandingkan_produk' %}" data-max="3" hidden>
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="min-w-0">
            <strong><i class="bi bi-layout-three-columns me-1"></i><span id="compare-count">0</span> produk dipilih</strong>
            <span class="small opacity-75 ms-1">(maks. 3)</span>
            <ul class="compare-tray__list" id="compare-list"></ul>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-light" id="compare-clear">Kosongkan</button>
            <a href="#" class="btn btn-sm btn-light fw-semibold" id="compare-go" aria-disabled="true">Bandingkan</a>
        </div>
    </div>
    <p class="compare-tray__note small mt-2 mb-0 text-warning" id="compare-note" role="status"></p>
</div>
