{% comment %}
    Dialog konfirmasi bersama (hapus / nonaktifkan) sesuai wireframe.
    Pemicu: <button data-bs-toggle="modal" data-bs-target="#modalKonfirmasi"
             data-aksi="URL" data-judul="..." data-pesan="..." data-tombol="...">
    Jika admin menekan Batal, tidak ada data yang berubah.
{% endcomment %}
<div class="modal fade" id="modalKonfirmasi" tabindex="-1" aria-labelledby="judulModalKonfirmasi" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form method="post" class="modal-content border-0 shadow">
            {% csrf_token %}
            <input type="hidden" name="kembali" value="{{ request.get_full_path }}">
            <div class="modal-body text-center p-4">
                <div class="sb-stat-icon sb-tone-accent mb-3 mx-auto"><i class="bi bi-exclamation-triangle"></i></div>
                <h2 class="modal-title h5 mb-2" id="judulModalKonfirmasi">Konfirmasi</h2>
                <p class="modal-pesan text-secondary mb-0"></p>
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0 pb-4">
                <button type="button" class="btn btn-light-subtle px-4" data-bs-dismiss="modal">Batal</button>
                <button type="submit" class="btn btn-primary px-4 tombol-lanjut">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
