{% extends 'smartbako/base.html' %}
{% load static %}

{% block title %}Lupa Password - SmartBako{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <a href="{% url 'smartbako:beranda' %}" class="inline-block mb-3">
                <img src="{% static 'smartbako/images/logo.png' %}" alt="SmartBako Logo" class="h-10 mx-auto">
            </a>
            <h1 class="text-2xl font-bold text-slate-800">Pemulihan Sandi</h1>
            <p class="text-sm text-slate-500 mt-1">Masukkan email Anda untuk menerima instruksi pemulihan password</p>
        </div>

        <!-- Form Lupa Password -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email Terdaftar</label>
                <input 
                    type="email" 
                    name="email" 
                    id="email" 
                    required 
                    placeholder="nama@email.com"
                    class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#581c1c] focus:border-transparent transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full py-2.5 bg-[#581c1c] hover:bg-[#451414] text-white font-medium text-sm rounded-lg transition duration-200 shadow-sm"
            >
                Kirim Instruksi
            </button>
        </form>

        <!-- Kembali ke Login -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Ingat password Anda? 
            <a href="{% url 'smartbako:login' %}" class="text-[#581c1c] font-medium hover:underline">Masuk di sini</a>
        </p>
    </div>
</div>
{% endblock %}
