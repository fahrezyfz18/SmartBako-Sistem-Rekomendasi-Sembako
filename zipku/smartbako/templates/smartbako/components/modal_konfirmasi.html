
<div class="modal fade"
     id="modalKonfirmasi"
     tabindex="-1"
     aria-labelledby="judulModalKonfirmasi"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="judulModalKonfirmasi">
                    Konfirmasi
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Tutup">
                </button>

            </div>

            <div class="modal-body">

                <p class="modal-pesan mb-0">
                    Apakah kamu yakin ingin melanjutkan tindakan ini?
                </p>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal">
                    Batal
                </button>

                <form method="post">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-danger tombol-lanjut">
                        Ya, Hapus
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
