{# Baki perbandingan produk. Diisi dan dikendalikan oleh js/pengguna.js #}
<div
    class="compare-tray"
    id="compare-tray"
    data-url="{% url 'smartbako:bandingkan_produk' %}"
    data-max="4"
    hidden
>
    <div class="compare-tray__inner">
        <div class="compare-tray__info">
            <strong><span id="compare-count">0</span> produk dipilih</strong>
            <ul class="compare-tray__list" id="compare-list"></ul>
        </div>

        <div class="compare-tray__actions">
            <button type="button" class="user-button user-button--ghost user-button--sm" id="compare-clear">
                Kosongkan
            </button>
            <a href="#" class="user-button user-button--sm" id="compare-go" aria-disabled="true">
                Bandingkan
            </a>
        </div>
    </div>
    <p class="compare-tray__note" id="compare-note" role="status"></p>
</div>
