{% load static %}
<!-- START: HEADER REUSABLE KOMPONEN NAVBAR -->
<header class="sticky top-0 z-50 bg-cream-50/90 backdrop-blur-md border-b border-cream-200/60 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        
        <!-- Logo Brand -->
        <a href="{% url 'smartbako:landing_page' %}#beranda" class="flex items-center group py-1">
            <img src="{% static 'smartbako/images/logo1.png' %}" alt="Logo SmartBako" class="h-12 sm:h-14 md:h-16 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
        </a>

        <!-- Menu Navigasi Utama (Terhubung ke One-Page Scroll) -->
        <nav class="hidden md:flex items-center space-x-8 font-medium text-sm text-dark-900/80">
            <a href="{% url 'smartbako:landing_page' %}#beranda" class="hover:text-maroon-800 transition duration-200">Beranda</a>
            <a href="{% url 'smartbako:landing_page' %}#fitur" class="hover:text-maroon-800 transition duration-200">Fitur</a>
            <a href="{% url 'smartbako:landing_page' %}#produk" class="hover:text-maroon-800 transition duration-200">Produk</a>
            <a href="{% url 'smartbako:landing_page' %}#tentang-kami" class="hover:text-maroon-800 transition duration-200">Tentang Kami</a>
        </nav>

        <!-- Tombol Aksi Autentikasi (Responsif untuk Mobile & Desktop) -->
        <div class="flex items-center space-x-2 sm:space-x-4">
            {% if request.user.is_authenticated %}
                <!-- Jika Pengguna Sudah Login -->
                <a href="{% url 'smartbako:beranda' %}" class="text-xs sm:text-sm font-medium text-slate-700 hover:text-maroon-800 px-2 py-1">
                    Halo, {{ request.user.first_name|default:request.user.username }}
                </a>
                <a href="{% url 'smartbako:logout' %}" class="bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-xl transition duration-200 border border-rose-200">
                    Keluar
                </a>
            {% else %}
                <!-- Jika Pengguna Belum Login -->
                <a href="{% url 'smartbako:login' %}" class="font-medium text-xs sm:text-sm text-slate-700 hover:text-maroon-800 px-2 sm:px-3 py-2 transition duration-200">
                    Masuk
                </a>
                <a href="{% url 'smartbako:registrasi' %}" class="bg-[#581c1c] hover:bg-[#451414] text-white font-medium text-xs sm:text-sm px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-xl shadow-md transition duration-300">
                    Daftar
                </a>
            {% endif %}
        </div>

    </div>
</header>
