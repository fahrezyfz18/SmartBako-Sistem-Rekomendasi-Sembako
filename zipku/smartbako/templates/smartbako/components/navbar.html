{% load static %}
{% with nama_url=request.resolver_match.url_name %}

<header class="sb-nav" id="sb-nav">
    <div class="sb-container sb-nav__bar">

        <a href="{% url 'smartbako:landing_page' %}" class="sb-nav__brand" aria-label="SmartBako - Beranda">
            <img src="{% static 'smartbako/images/logo1.png' %}" alt="SmartBako" width="175" height="48">
        </a>

        <button
            type="button"
            class="sb-nav__toggle"
            data-nav-toggle
            aria-expanded="false"
            aria-controls="sb-nav-menu"
            aria-label="Buka menu"
        >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path class="sb-nav__bars" d="M4 7h16M4 12h16M4 17h16"/>
                <path class="sb-nav__close" d="M6 6l12 12M18 6L6 18"/>
            </svg>
        </button>

        <div class="sb-nav__menu" id="sb-nav-menu">
            <nav class="sb-nav__links" aria-label="Navigasi utama">
                <a href="{% url 'smartbako:landing_page' %}" {% if nama_url == 'landing_page' %}class="is-active" aria-current="page"{% endif %}>Beranda</a>
                <a href="{% url 'smartbako:fitur' %}" {% if nama_url == 'fitur' %}class="is-active" aria-current="page"{% endif %}>Fitur</a>
                <a href="{% url 'smartbako:produk_publik' %}" {% if nama_url == 'produk_publik' %}class="is-active" aria-current="page"{% endif %}>Produk</a>
                <a href="{% url 'smartbako:tentang_kami' %}" {% if nama_url == 'tentang_kami' %}class="is-active" aria-current="page"{% endif %}>Tentang Kami</a>
            </nav>

            <div class="sb-nav__auth">
                {% if request.user.is_authenticated %}
                    <a
                        href="{% if request.user.is_staff %}{% url 'smartbako:dashboard_admin' %}{% else %}{% url 'smartbako:beranda' %}{% endif %}"
                        class="sb-btn sb-btn--primary sb-btn--sm"
                    >
                        Buka Dashboard
                    </a>
                {% else %}
                    <a href="{% url 'smartbako:login' %}" class="sb-btn sb-btn--text sb-btn--sm">Masuk</a>
                    <a href="{% url 'smartbako:registrasi' %}" class="sb-btn sb-btn--primary sb-btn--sm">Daftar</a>
                {% endif %}
            </div>
        </div>

    </div>
</header>

{% endwith %}
